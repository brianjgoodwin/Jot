name: Build and Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Jot.xcodeproj \
            -scheme Jot \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log
          echo "--- Build errors (if any) ---"
          grep -E "error:" build.log || echo "No errors found"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Jot.xcodeproj \
            -scheme Jot \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee test.log
          echo "--- Test results ---"
          grep -E "Test Suite|Executed|error:|failed" test.log || true
